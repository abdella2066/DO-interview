# DigitalOcean App Platform spec, applied by GitHub Actions (digitalocean/app_action) on every
# push to main once tests pass. ${API_KEY} is filled in from the GitHub secret at deploy time;
# ${db.DATABASE_URL} and ${cache.DATABASE_URL} are resolved by App Platform itself.
name: feature-flags
region: nyc
services:
  - name: api
    git:
      repo_clone_url: https://github.com/abdella2066/DO-interview.git
      branch: main
    dockerfile_path: Dockerfile
    http_port: 8080
    # Two instances are safe because they share the Valkey cache: one invalidation reaches both.
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /readyz
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: CACHE_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${API_KEY}
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    git:
      repo_clone_url: https://github.com/abdella2066/DO-interview.git
      branch: main
    dockerfile_path: Dockerfile
    run_command: alembic upgrade head
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
databases:
  - name: db
    engine: PG
    production: false
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: feature-flags-cache
