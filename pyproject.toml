[project]
name = "feature-flag-service"
version = "1.0.0"
description = "REST API for storing, managing, and evaluating feature flags"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]
